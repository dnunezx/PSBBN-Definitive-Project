name: PSBBN MMCE v10 Preview Build

on:
  push:
    branches: [release/mmce-v10-source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psbbn-mmce-v10-draft
  cancel-in-progress: false

env:
  RELEASE_TAG: psbbn-mmce-v10-preview
  GH_TOKEN: ${{ github.token }}

jobs:
  build-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Require an unpublished draft and download the validated image
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir -p release-input release-output
          gh release download "$RELEASE_TAG" --pattern psbbn-mmce-v10-preview.zip --dir release-input
          gh release view "$RELEASE_TAG" --json body --jq .body > release-output/INSTALL.md
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct,hashlib
          root=Path('experiments/psbbn-mmce'); source=Path('release-input/psbbn-mmce-v10-preview.zip')
          with zipfile.ZipFile(source) as z:
              expected={'psbbn_boot.elf':'949beab2572a9bda2610050136831753c2e494bf0ec4789c53d10b45f205422c',
                        'psbbn_diagnostic.elf':'a76d7dde0f4eec91a84d78667a0552c53af80de0cde7bf160ac5c11019e2996b'}
              for name,digest in expected.items():
                  data=z.read(name); assert hashlib.sha256(data).hexdigest()==digest
                  Path('release-input',name).write_bytes(data)
              with z.open('PSBBN/psbbn.img') as f:
                  h=hashlib.sha256(); size=0
                  while chunk:=f.read(4*1024**2): h.update(chunk); size+=len(chunk)
              assert size==7516192768 and h.hexdigest()=='0cedc28cc0a3e442789b0b246253d61c7fd6d9928c50808a9833f39d7b32b31c'
              profile=z.read('PSBBN/real-checks.bin')
              assert hashlib.sha256(profile).hexdigest()=='a288acd99018a87c134d738846a8fa0bdabde70687bb4d5d25634fd885782759'
              Path('release-input/real-checks.bin').write_bytes(profile)
          data=Path('release-input/psbbn_boot.elf').read_bytes()
          shoff=struct.unpack_from('<I',data,32)[0]; stride,count=struct.unpack_from('<HH',data,46)
          sections=[struct.unpack_from('<10I',data,shoff+i*stride) for i in range(count)]
          kernel=None
          for section in sections:
              if section[1]!=2: continue
              strings=sections[section[6]]; names=data[strings[4]:strings[4]+strings[5]]
              for at in range(section[4],section[4]+section[5],section[9]):
                  name,address,size,info,other,target=struct.unpack_from('<IIIBBH',data,at)
                  if target and names[name:].split(b'\0',1)[0]==b'linux_kernel':
                      s=sections[target]; start=s[4]+address-s[3]; kernel=data[start:start+size]
          assert kernel and kernel[:4]==b'\x7fELF'
          (root/'build/linux').mkdir(parents=True)
          (root/'build/linux/vmlinux').write_bytes(kernel)
          PY
      - name: Compile production code with the pinned SDK
        run: |
          set -euo pipefail
          docker build -t psbbn-release experiments/psbbn-mmce
          docker run --rm -v "$PWD:/repo" -v "$PWD/experiments/psbbn-mmce:/work" -e PSBBN_REPO_ROOT=/repo psbbn-release bash -c 'make -f Makefile.release release'
      - name: Verify loaded programs and package release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,struct,zipfile,shutil,subprocess
          root=Path('experiments/psbbn-mmce'); out=Path('release-output')
          def loaded(data):
              assert data[:7]==b'\x7fELF\x01\x01\x01'
              entry,offset=struct.unpack_from('<II',data,24); stride,count=struct.unpack_from('<HH',data,42)
              values=[]
              for i in range(count):
                  kind,at,va,pa,fs,ms,flags,align=struct.unpack_from('<8I',data,offset+i*stride)
                  if kind==1: values.append((va,pa,ms,flags,align,data[at:at+fs]))
              return entry,values
          manifest={'commit':os.environ['GITHUB_SHA'],'image_sha256':'0cedc28cc0a3e442789b0b246253d61c7fd6d9928c50808a9833f39d7b32b31c',
                    'native_sha256':'dd9fd17c4f161202540d2e7dc630d2816502189cdeb9d97dee1703a3324c4ecf',
                    'loaded_programs_identical':True,'hardware_gameplay_verified_by_ci':False,'launchers':{}}
          # IRX modules contain non-loaded compiler debug sections. Require the
          # complete loaded program, including those embedded bytes, to match.
          for public,built in [('psbbn_boot.elf','psbbn_mmce_combined.elf'),('psbbn_diagnostic.elf','psbbn_mmce_perf.elf')]:
              data=(root/built).read_bytes(); reference=Path('release-input',public).read_bytes()
              assert loaded(data)==loaded(reference), 'Loaded program changed: '+public
              (out/public).write_bytes(data)
              manifest['launchers'][public]={'sha256':hashlib.sha256(data).hexdigest(),'image_package_sha256':hashlib.sha256(reference).hexdigest()}
          native=(root/'build/release/native-patch.bin').read_bytes()
          assert hashlib.sha256(native).hexdigest()==manifest['native_sha256']
          (out/'BUILD-VERIFICATION.json').write_text(json.dumps(manifest,indent=2)+'\n')
          shutil.copyfile('release-input/real-checks.bin',out/'real-checks.bin')
          PY
          curl --fail --location --retry 3 https://api.github.com/repos/CosmicScale/PSBBN-Definitive-Patch-Kernel/tarball/80b14105512ed6114c1defa8e9dee40679072874 -o release-input/kernel-source.tar.gz
          curl --fail --location --retry 3 https://api.github.com/repos/rickgaiser/neutrino/tarball/v1.8.0 -o release-input/neutrino-source.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,subprocess,hashlib,json
          out=Path('release-output'); root=Path('experiments/psbbn-mmce')
          body=(out/'INSTALL.md').read_text().split('\nDownload SHA-256:',1)[0].rstrip()+'\n'
          (out/'INSTALL.md').write_text(body)
          manifest=json.loads((out/'BUILD-VERIFICATION.json').read_text())
          checks={}
          archive=out/'psbbn-mmce-v10-preview.zip'
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('release-input/psbbn-mmce-v10-preview.zip') as seed, zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              h=hashlib.sha256(); size=0
              with seed.open('PSBBN/psbbn.img') as src,z.open('PSBBN/psbbn.img','w',force_zip64=True) as dst:
                  while chunk:=src.read(4*1024**2): dst.write(chunk); h.update(chunk); size+=len(chunk)
              assert size==7516192768 and h.hexdigest()==manifest['image_sha256']
              checks['PSBBN/psbbn.img']=h.hexdigest()
              def add(name,data):
                  assert name not in checks and not name.startswith('/') and '..' not in Path(name).parts
                  z.writestr(name,data); checks[name]=hashlib.sha256(data).hexdigest()
              for name in ('psbbn_boot.elf','psbbn_diagnostic.elf','INSTALL.md','BUILD-VERIFICATION.json'): add(name,(out/name).read_bytes())
              add('PSBBN/real-checks.bin',(out/'real-checks.bin').read_bytes())
              for p in sorted((root/'licenses').glob('*.txt')): add('licenses/'+p.name,p.read_bytes())
              image_manifest=json.loads(seed.read('IMAGE-MANIFEST.json'))
              assert image_manifest['image_sha256']==manifest['image_sha256']
              assert image_manifest['checks_sha256']==checks['PSBBN/real-checks.bin']
              add('IMAGE-MANIFEST.json',(json.dumps(image_manifest,indent=2)+'\n').encode())
              prefix=str(root)+'/'
              for name in files:
                  if not name: continue
                  relative=name.removeprefix(prefix)
                  production=name.startswith(prefix) and (relative.split('/')[0] in ('src','include','iop','kernel','vendor','image','licenses') or relative in ('Makefile','Makefile.release','Dockerfile'))
                  assets=name.startswith('scripts/assets/neutrino/') or name in ('scripts/assets/database/TitlesDB_PS2.csv','icons/art/ps2.png','icons/ico/dvd.ico')
                  if (production or assets or name.startswith('.github/workflows/')) and Path(name).is_file() and Path(name).suffix.lower() not in ('.o','.log','.img','.md'):
                      assert not any(p in Path(name).parts for p in ('tools','tests','private','build','__pycache__'))
                      add('source/'+name,Path(name).read_bytes())
              for name in ('kernel-source.tar.gz','neutrino-source.tar.gz'): add('source/upstream/'+name,Path('release-input',name).read_bytes())
              sums=''.join(checks[n]+'  '+n+'\n' for n in sorted(checks))
              z.writestr('SHA256SUMS',sums)
          assert archive.stat().st_size<2*1024**3
          with zipfile.ZipFile(archive) as z:
              assert len(z.namelist())==len(checks)+1 and not any(p.is_dir() for p in z.infolist())
              assert not any(n in ('CD/','DVD/') or n.endswith('.zip') for n in z.namelist())
          digest=hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()
          (out/'RELEASE-BODY.md').write_text(body+'\nDownload SHA-256: `'+digest+'`\n')
          print('One complete ZIP:',archive.stat().st_size,'bytes; SHA-256',digest)
          PY
      - name: Attach assets to draft without publishing
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" release-output/psbbn-mmce-v10-preview.zip --clobber
          gh release edit "$RELEASE_TAG" --draft --prerelease --latest=false --target "$GITHUB_SHA" --notes-file release-output/RELEASE-BODY.md
          for obsolete in psbbn-mmce-v10-image.zip psbbn-mmce-v10-launchers.zip psbbn-mmce-v10-source.zip BUILD-VERIFICATION.json SHA256SUMS; do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$obsolete"; then
              gh release delete-asset "$RELEASE_TAG" "$obsolete" --yes
            fi
          done
