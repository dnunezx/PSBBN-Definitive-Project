name: PSBBN MMCE ATA Probe

on:
  push:
    paths:
      - 'experiments/psbbn-mmce/**'
      - '.github/workflows/psbbn-mmce-probe.yml'
  pull_request:
    paths:
      - 'experiments/psbbn-mmce/**'
      - '.github/workflows/psbbn-mmce-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps2dev/ps2dev:latest
    defaults:
      run:
        working-directory: experiments/psbbn-mmce
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain configuration
        run: |
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          command -v ee-gcc || true
          test -f "$PS2SDK/samples/Makefile.eeglobal"
      - name: Compile read-only ATA probe
        run: make
      - name: Check output
        run: test -s ata_probe.elf
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: psbbn-mmce-ata-probe
          path: experiments/psbbn-mmce/ata_probe.elf
          if-no-files-found: error
