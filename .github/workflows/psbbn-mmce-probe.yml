name: PSBBN MMCE Diagnostics

on:
  push:
    paths:
      - 'experiments/psbbn-mmce/**'
      - '.github/workflows/psbbn-mmce-probe.yml'
  pull_request:
    paths:
      - 'experiments/psbbn-mmce/**'
      - '.github/workflows/psbbn-mmce-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check corruption detection and request bounds
        working-directory: experiments/psbbn-mmce
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_suite_logic.c -o "$RUNNER_TEMP/suite-logic-tests"
          "$RUNNER_TEMP/suite-logic-tests"
          python3 tests/test_real_profile.py "$RUNNER_TEMP/real-checks.bin"
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_real_checks.c -o "$RUNNER_TEMP/real-checks-tests"
          "$RUNNER_TEMP/real-checks-tests" "$RUNNER_TEMP/real-checks.bin"
          cc -std=c11 -Wall -Wno-format -Wno-unused-variable -Itests/atad_stubs -Ivendor/common -Ivendor/atad/include tests/test_atad_ro.c -o "$RUNNER_TEMP/atad-ro-tests"
          "$RUNNER_TEMP/atad-ro-tests"
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_block_rpc.c -o "$RUNNER_TEMP/block-rpc-tests"
          "$RUNNER_TEMP/block-rpc-tests"
          cc -std=c11 -Wall -Wno-format -Wno-unused-variable -Itests/atad_stubs -Ivendor/common -Ivendor/atad/include tests/test_atad_checked.c -o "$RUNNER_TEMP/atad-checked-tests"
          "$RUNNER_TEMP/atad-checked-tests"
          cc -std=c11 -Wall -Wextra -Werror -Wno-missing-field-initializers -Wno-sign-compare -Ivendor/common -Ivendor/mmcefhi/include tests/test_fhi_lifecycle.c -o "$RUNNER_TEMP/fhi-lifecycle-tests"
          "$RUNNER_TEMP/fhi-lifecycle-tests"
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_boot_trace.c -o "$RUNNER_TEMP/boot-trace-tests"
          "$RUNNER_TEMP/boot-trace-tests"
          cc -std=c11 -Wall -Wextra -Werror -Itests/console_stubs tests/test_boot_console.c -o "$RUNNER_TEMP/boot-console-tests"
          "$RUNNER_TEMP/boot-console-tests"
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_live_samples.c -o "$RUNNER_TEMP/live-sample-tests"
          "$RUNNER_TEMP/live-sample-tests"
          python3 tests/test_cdvd_config.py --emit "$RUNNER_TEMP/cdvd-config-tests.c"
          cc -std=c11 -Wall -Wextra -Werror "$RUNNER_TEMP/cdvd-config-tests.c" -o "$RUNNER_TEMP/cdvd-config-tests"
          "$RUNNER_TEMP/cdvd-config-tests"
          python3 tests/test_sbios_rpc.py "$RUNNER_TEMP/sbios-rpc-tests.c"
          cc -std=c11 -Wall -Wextra -Werror "$RUNNER_TEMP/sbios-rpc-tests.c" -o "$RUNNER_TEMP/sbios-rpc-tests"
          "$RUNNER_TEMP/sbios-rpc-tests"
          python3 tests/test_sio2man_hook.py "$RUNNER_TEMP/sio2man-hook-tests.c"
          cc -std=c11 -Wall -Wextra -Werror -Wno-pointer-to-int-cast -fsanitize=undefined "$RUNNER_TEMP/sio2man-hook-tests.c" -o "$RUNNER_TEMP/sio2man-hook-tests"
          "$RUNNER_TEMP/sio2man-hook-tests"

      # Keep JavaScript actions on Ubuntu; only the compiler runs in Alpine.
      - name: Prepare pinned PS2SDK build environment
        run: docker build -t psbbn-probe-build experiments/psbbn-mmce

      - name: Compile and capture diagnostic log
        shell: bash
        working-directory: experiments/psbbn-mmce
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" psbbn-probe-build bash build.sh 2>&1 | tee build.log

      - name: Validate generated disk against suite byte checker
        working-directory: experiments/psbbn-mmce
        run: '"$RUNNER_TEMP/suite-logic-tests" dist/PSBBN/diagnostic.img'

      - name: Upload build log (including on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psbbn-mmce-build-log
          path: experiments/psbbn-mmce/build.log
          if-no-files-found: warn

      - name: Upload compiled ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: psbbn-mmce-diagnostic-suite
          path: experiments/psbbn-mmce/dist/
          if-no-files-found: error
