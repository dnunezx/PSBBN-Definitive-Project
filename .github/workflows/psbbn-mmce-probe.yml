name: PSBBN MMCE ATA Probe

on:
  push:
    paths:
      - 'experiments/psbbn-mmce/**'
      - '.github/workflows/psbbn-mmce-probe.yml'
  pull_request:
    paths:
      - 'experiments/psbbn-mmce/**'
      - '.github/workflows/psbbn-mmce-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          apk add --no-cache make file
          command -v make
          make --version

      - name: Compile and capture diagnostic log
        id: compile
        shell: bash
        working-directory: experiments/psbbn-mmce
        run: |
          set -o pipefail
          {
            echo '=== Toolchain information ==='
            echo "PS2DEV=${PS2DEV:-UNSET}"
            echo "PS2SDK=${PS2SDK:-UNSET}"
            command -v ee-gcc || true
            ee-gcc --version || true
            echo '=== Project files ==='
            ls -la
            echo '=== Build ==='
            make V=1
          } 2>&1 | tee build.log

      - name: Verify ELF
        working-directory: experiments/psbbn-mmce
        run: |
          test -s ata_probe.elf
          file ata_probe.elf || true

      - name: Upload build log (including on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psbbn-mmce-build-log
          path: experiments/psbbn-mmce/build.log
          if-no-files-found: warn

      - name: Upload compiled ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: psbbn-mmce-ata-probe
          path: experiments/psbbn-mmce/ata_probe.elf
          if-no-files-found: error
